# ChatAura PostgreSQL 16 tuning (2 vCPU / ~8 GB VPS production targets)
# Local docker-compose overrides some of these via -c flags for lighter RAM.

listen_addresses = '*'
max_connections = 100

shared_buffers = 1024MB
effective_cache_size = 3072MB
work_mem = 16MB
maintenance_work_mem = 256MB

random_page_cost = 1.1
effective_io_concurrency = 200

wal_buffers = 64MB
checkpoint_completion_target = 0.9
min_wal_size = 1GB
max_wal_size = 4GB

log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
