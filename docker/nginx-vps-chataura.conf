# ==============================================================================
# CHATAURA V2 BACKEND & NEXTADMIN (Host VPS Nginx Reverse Proxy Configuration)
# ==============================================================================
#
# Target File on Host VPS:
#   /etc/nginx/sites-available/chataura.in
#   (or inside the existing server { listen 443 ssl; server_name chataura.in; ... } block)
#
# How it works:
#   - https://chataura.in/api/v1/*   --> Stays 100% UNTOUCHED (legacy Laravel PHP-FPM)
#   - https://chataura.in/nextadmin  --> Proxies to Docker Next.js Admin Panel (port 3100)
#   - https://chataura.in/api/v2/*   --> Proxies to Docker NestJS Backend API (port 3005)
#   - https://chataura.in/socket.io/ --> Proxies to Docker NestJS WebSockets (port 3005)
#
# ==============================================================================

# 1. Next.js 14 Admin Panel (/nextadmin and /nextadmin/login)
location /nextadmin {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Static assets caching optimization for Next.js
    location /nextadmin/_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }
}

# 2. ChatAura NestJS Modular Monolith API v2 (/api/v2/*)
location /api/v2/ {
    # Rate limit protection (optional: rate=30r/s burst=60)
    proxy_pass http://127.0.0.1:3005/api/v2/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 80M;
}

# 3. ChatAura Real-time WebSockets (Socket.IO for party rooms & games)
location /socket.io/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
