# Test server routes. Installed as /etc/nginx/snippets/chataura-staging.conf and included from
# the chataura.in server block with one line:  include snippets/chataura-staging.conf;
# Remove that line (and reload nginx) to take the test server offline.

# Staging admin panel (built with basePath /test/nextadmin).
location /test/nextadmin {
    proxy_pass http://127.0.0.1:3110;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Staging API, uploads and public assets: /test/<path> -> staging Nest /<path>.
location /test/ {
    proxy_pass http://127.0.0.1:3015/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 80M;
}
